<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#B9472B" />
    <title>Hors ligne | Je mange Africain</title>
    <style>
      :root {
        color-scheme: light;
        --earth: #b9472b;
        --terre: #d65a32;
        --gold: #f2a900;
        --burgundy: #8a3042;
        --charcoal: #3f2930;
        --cream: #fff9f2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #fff;
        color: var(--charcoal);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      main {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: max(1.25rem, env(safe-area-inset-top)) 1rem max(1.25rem, env(safe-area-inset-bottom));
      }

      .shell {
        width: min(100%, 28rem);
        overflow: hidden;
        border-top: 1px solid rgba(138, 48, 66, 0.12);
        border-bottom: 1px solid rgba(138, 48, 66, 0.12);
        background: #fffcfa;
        box-shadow: 0 24px 70px -54px rgba(90, 38, 50, 0.72);
      }

      .stripe {
        height: 3px;
        background: linear-gradient(90deg, var(--earth), var(--gold) 54%, var(--terre));
      }

      .content {
        padding: 1.25rem;
      }

      .brand {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 0.8rem;
      }

      .brand img {
        width: 3.5rem;
        height: 3.5rem;
        flex: 0 0 3.5rem;
        object-fit: contain;
      }

      .brand strong {
        display: block;
        font-size: 1.16rem;
        line-height: 1.05;
        color: var(--burgundy);
      }

      .brand span {
        display: block;
        margin-top: 0.2rem;
        font-size: 0.64rem;
        font-weight: 900;
        line-height: 1.3;
        text-transform: uppercase;
        color: var(--earth);
      }

      h1 {
        margin: 1.35rem 0 0;
        font-size: clamp(1.65rem, 9vw, 2.35rem);
        line-height: 1.04;
        color: var(--charcoal);
      }

      p {
        margin: 0.75rem 0 0;
        font-size: 0.92rem;
        line-height: 1.7;
        color: rgba(63, 41, 48, 0.72);
      }

      .signals {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.45rem;
        margin-top: 1.2rem;
      }

      .signal {
        min-width: 0;
        border: 1px solid rgba(63, 41, 48, 0.08);
        border-radius: 0.5rem;
        background: #fff;
        padding: 0.75rem 0.55rem;
      }

      .signal b {
        display: block;
        overflow: hidden;
        color: var(--burgundy);
        font-size: 0.64rem;
        line-height: 1.2;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .signal span {
        display: block;
        margin-top: 0.28rem;
        color: rgba(63, 41, 48, 0.58);
        font-size: 0.68rem;
        line-height: 1.25;
      }

      a {
        display: inline-flex;
        min-height: 2.85rem;
        width: 100%;
        align-items: center;
        justify-content: center;
        margin-top: 1.25rem;
        border-radius: 0.5rem;
        background: var(--earth);
        color: var(--cream);
        font-size: 0.88rem;
        font-weight: 900;
        text-decoration: none;
        box-shadow: 0 16px 34px -24px rgba(185, 71, 43, 0.9);
      }

      small {
        display: block;
        margin-top: 0.8rem;
        color: rgba(63, 41, 48, 0.5);
        font-size: 0.66rem;
        line-height: 1.5;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-labelledby="offline-title">
        <div class="stripe"></div>
        <div class="content">
          <div class="brand">
            <img src="/brand/logo-mark-burgundy.png" alt="" width="56" height="56" />
            <span>
              <strong>Je mange Africain</strong>
              Cuisine &amp; &eacute;picerie
            </span>
          </div>
          <h1 id="offline-title">Connexion interrompue.</h1>
          <p>La boutique garde son espace mobile pr&ecirc;t. Retrouvez vos pages d&egrave;s que le r&eacute;seau revient.</p>
          <div class="signals" aria-label="Services conserves">
            <div class="signal"><b>Catalogue</b><span>Derni&egrave;re vue</span></div>
            <div class="signal"><b>Recettes</b><span>Panier local</span></div>
            <div class="signal"><b>Livraison</b><span>Suivi &agrave; jour</span></div>
          </div>
          <a href="/">Revenir &agrave; l'accueil</a>
          <small>Cr&eacute;&eacute;e par Promise Corporation</small>
        </div>
      </section>
    </main>
  </body>
</html>
